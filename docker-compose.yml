services:
  postgres:
    image: postgres:18-alpine
    container_name: nexhire-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-nexhire}
    volumes:
      # PG 18+ recommends mounting at /var/lib/postgresql (data goes in a subdir)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nexhire}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

  redis:
    image: redis:7-alpine
    container_name: nexhire-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

  minio:
    image: minio/minio:latest
    container_name: nexhire-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  nexhire-net:
    driver: bridge
