services:
  postgres:
    image: postgres:18-alpine
    container_name: nexhire-postgres
    restart: unless-stopped
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      # PG 18+ recommends mounting at /var/lib/postgresql (data goes in a subdir)
      - pgdata:/var/lib/postgresql
      # DB-per-service bootstrap (runs once on a fresh volume)
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexhire-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexhire}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-nexhire}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nexhire-net

  redis:
    image: redis:7-alpine
    container_name: nexhire-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

  minio:
    image: minio/minio:latest
    container_name: nexhire-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexhire-net

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  miniodata:

networks:
  nexhire-net:
    driver: bridge
